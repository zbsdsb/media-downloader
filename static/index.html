<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>无水印极速媒体下载站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 pb-16">

    <main class="w-full max-w-xl my-auto py-3 sm:py-6">
        
        <!-- Header -->
        <header class="text-center mb-5">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-semibold mb-2">
                <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
                <span>Pro 4K / 原画最高码率 · 全平台适配</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-sky-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                抖音 & Instagram 媒体解析
            </h1>
            <p class="text-xs text-slate-400 mt-1.5">无水印视频 · 原图高清图集 · Reels 及背景原声</p>
        </header>

        <!-- 输入区域卡片 -->
        <div class="glass-panel rounded-3xl p-4 sm:p-6 shadow-2xl shadow-black/50">
            <div class="relative">
                <textarea id="urlInput" rows="3" 
                    placeholder="在此粘贴抖音视频/图文口令、短链接，或 Instagram 链接..." 
                    class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20 transition resize-none"></textarea>
                
                <div class="absolute bottom-2.5 right-2.5 flex items-center gap-2">
                    <button type="button" onclick="pasteClipboard()" title="从剪贴板粘贴" 
                        class="text-xs bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-600/60 transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        <span>粘贴</span>
                    </button>
                    <button type="button" onclick="clearInput()" title="清空" id="clearBtn"
                        class="hidden text-xs bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-400 hover:text-slate-200 px-2 py-1.5 rounded-xl border border-slate-600/60 transition cursor-pointer">
                        ✕
                    </button>
                </div>
            </div>

            <!-- 解析按钮 -->
            <button type="button" onclick="parseContent()" id="submitBtn"
                class="w-full mt-3.5 bg-gradient-to-r from-sky-500 via-indigo-600 to-purple-600 hover:opacity-95 active:scale-[0.99] text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-indigo-500/25 transition duration-200 flex items-center justify-center gap-2 text-sm sm:text-base cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span>立即解析最高画质</span>
            </button>

            <!-- 快捷按钮栏 -->
            <div class="mt-3.5 flex items-center justify-between text-xs text-slate-400 px-1">
                <span>🎵 抖音视频/图文</span>
                <span>📸 Ins Reels/Post</span>
                <button type="button" onclick="toggleShortcutModal()" class="text-sky-400 hover:underline flex items-center gap-1 cursor-pointer">
                    ⚡ iOS 快捷指令配置
                </button>
            </div>
        </div>

        <!-- 结果展示卡片 -->
        <div id="resultCard" class="hidden mt-5 glass-panel rounded-3xl p-4 sm:p-6 shadow-2xl space-y-4">
            <!-- 作者与平台信息 -->
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <div class="flex items-center gap-3">
                    <img id="resAvatar" class="w-10 h-10 rounded-full border border-slate-600 object-cover bg-slate-800" src="" alt="avatar" />
                    <div>
                        <div class="flex items-center gap-2">
                            <span id="resAuthor" class="font-bold text-sm text-slate-100"></span>
                            <span id="resPlatformBadge" class="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-sky-500/20 text-sky-300 border border-sky-500/30"></span>
                        </div>
                        <span id="resQualityBadge" class="text-xs text-emerald-400 font-mono flex items-center gap-1 mt-0.5">
                            ✓ <span id="resQualityText"></span>
                        </span>
                    </div>
                </div>
                <button type="button" onclick="copyTitle()" title="复制文案" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800/80 px-2.5 py-1.5 rounded-xl border border-slate-700 cursor-pointer">
                    复制文案
                </button>
            </div>

            <!-- 作品文案 -->
            <p id="resTitle" class="text-xs sm:text-sm text-slate-200 leading-relaxed max-h-24 overflow-y-auto select-text"></p>

            <!-- 媒体渲染容器 -->
            <div id="mediaContainer"></div>
        </div>

    </main>

    <!-- iOS 快捷指令配置弹窗 -->
    <div id="shortcutModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full rounded-3xl p-5 shadow-2xl space-y-3.5 border border-slate-700">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    ⚡ iOS 快捷指令直存相册配置
                </h3>
                <button type="button" onclick="toggleShortcutModal()" class="text-slate-400 hover:text-slate-200 text-lg p-1 cursor-pointer">
                    ✕
                </button>
            </div>
            
            <p class="text-xs text-slate-300 leading-relaxed">
                手机浏览器受苹果权限限制无法静默写入相册，但「快捷指令」具有系统原生权限，可实现<b>完全无感将 17 张原图全自动存入相册</b>！
            </p>

            <div class="bg-slate-900/90 rounded-2xl p-3 border border-slate-700/80 space-y-2 text-xs">
                <div class="flex justify-between items-center text-slate-400">
                    <span>快捷指令 POST 目标 URL：</span>
                    <button type="button" onclick="copyEndpoint()" class="text-sky-400 hover:underline cursor-pointer">复制</button>
                </div>
                <code id="apiEndpoint" class="block bg-black/50 p-2 rounded-lg text-[11px] font-mono text-emerald-400 break-all select-all"></code>
            </div>

            <button type="button" onclick="toggleShortcutModal()" class="w-full bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-semibold cursor-pointer">
                关闭
            </button>
        </div>
    </div>

    <!-- 预览大图弹窗 (Lightbox) -->
    <div id="previewModal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-4" onclick="closePreview()">
        <div class="relative max-w-full max-h-[85vh] flex items-center justify-center">
            <img id="previewImg" class="max-w-full max-h-[82vh] rounded-2xl object-contain shadow-2xl" src="" alt="preview" />
        </div>
        <p class="text-xs text-slate-400 mt-3">长按图片可直接选择「存储到照片」· 点击任意区域关闭</p>
    </div>

    <footer class="text-center text-[11px] text-slate-500">
        <p>无水印 · 最高分辨率 · 纯净自建服务</p>
    </footer>

    <script>
        var currentData = null;
        var inputEl = document.getElementById("urlInput");
        var clearBtn = document.getElementById("clearBtn");
        inputEl.addEventListener("input", function() {
            if (inputEl.value) { clearBtn.classList.remove("hidden"); } else { clearBtn.classList.add("hidden"); }
        });

        function clearInput() {
            inputEl.value = "";
            clearBtn.classList.add("hidden");
            inputEl.focus();
        }

        async function pasteClipboard() {
            try {
                var text = await navigator.clipboard.readText();
                if (text) {
                    inputEl.value = text;
                    clearBtn.classList.remove("hidden");
                }
            } catch (err) {
                alert("请在输入框内长按粘贴");
            }
        }

        function copyTitle() {
            var title = document.getElementById("resTitle").innerText;
            navigator.clipboard.writeText(title).then(function() { alert("文案已复制！"); });
        }

        function toggleShortcutModal() {
            var modal = document.getElementById("shortcutModal");
            modal.classList.toggle("hidden");
            document.getElementById("apiEndpoint").innerText = window.location.origin + "/api/shortcut";
        }

        function copyEndpoint() {
            var ep = window.location.origin + "/api/shortcut";
            navigator.clipboard.writeText(ep).then(function() { alert("API 端点已复制！"); });
        }

        function openPreview(url) {
            var m = document.getElementById("previewModal");
            document.getElementById("previewImg").src = url;
            m.classList.remove("hidden");
        }

        function closePreview() {
            document.getElementById("previewModal").classList.add("hidden");
        }

        async function parseContent() {
            var rawVal = inputEl.value.trim();
            if (!rawVal) {
                alert("请先粘贴链接或分享口令！");
                return;
            }

            var btn = document.getElementById("submitBtn");
            var originalHtml = btn.innerHTML;
            btn.innerHTML = "<span class=\"animate-spin mr-1\">⏳</span> 正在提取最高画质...";
            btn.disabled = true;

            try {
                var res = await fetch("/api/parse", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: rawVal })
                });
                var data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "解析失败，请检查链接有效性");
                }

                currentData = data;
                renderCard(data);
            } catch (err) {
                alert(err.message || "请求发生错误");
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // 电脑端/全平台逐张批量直下函数
        async function downloadAllSequential() {
            if (!currentData || !currentData.medias || currentData.medias.length === 0) return;
            var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            var total = currentData.medias.length;

            if (isMobile) {
                // 移动端如果是本地 HTTP 访问，提示用户使用打包下载或长按存图
                var proceed = confirm("手机浏览器会对每张图弹窗询问下载。\n\n推荐：点击旁边的「打包下载原图 (ZIP)」只弹 1 次确认最方便！\n\n是否仍尝试逐张下载？");
                if (!proceed) return;
            }

            var btn = document.getElementById("batchDownloadBtn");
            var originalText = btn.innerHTML;
            btn.disabled = true;

            for (var i = 0; i < total; i++) {
                btn.innerHTML = "正在下载 (" + (i + 1) + "/" + total + ")...";
                var item = currentData.medias[i];
                var a = document.createElement("a");
                a.href = item.download_url;
                a.download = (currentData.title || "image") + "_图" + (i + 1) + ".jpg";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                await new Promise(function(r) { setTimeout(r, 800); });
            }

            btn.innerHTML = "✓ 全部下载完成 (" + total + "张)";
            setTimeout(function() {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 3000);
        }

        // 尝试唤起原生相册共享（仅在 HTTPS 安全上下文下生效）
        async function tryShareToPhotos() {
            if (!currentData || !currentData.medias || currentData.medias.length === 0) return;
            var btn = document.getElementById("sharePhotosBtn");
            var originalText = btn.innerHTML;
            btn.innerHTML = "⏳ 正在准备原图...";
            btn.disabled = true;

            try {
                var files = [];
                var total = currentData.medias.length;
                for (var i = 0; i < total; i++) {
                    btn.innerHTML = "准备中 (" + (i + 1) + "/" + total + ")...";
                    var item = currentData.medias[i];
                    var blobResp = await fetch(item.download_url);
                    var blob = await blobResp.blob();
                    var file = new File([blob], (currentData.title || "image") + "_图" + (i + 1) + ".jpg", { type: "image/jpeg" });
                    files.push(file);
                }

                if (navigator.canShare && navigator.canShare({ files: files })) {
                    await navigator.share({
                        files: files,
                        title: currentData.title || "无水印高清图集"
                    });
                    btn.innerHTML = "✓ 已存入相册";
                } else {
                    alert("因为当前是内网 HTTP 访问（非 HTTPS 域名），浏览器出于安全策略关闭了原生相册直写权限。\n\n手机上请使用「打包下载 (ZIP)」或「iOS 快捷指令」一键直存相册！");
                }
            } catch (err) {
                if (err.name !== "AbortError") {
                    alert("当前环境无法直接写入相册，建议使用「打包下载 (ZIP)」或「iOS 快捷指令」！");
                }
            } finally {
                setTimeout(function() {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 3000);
            }
        }

        function renderCard(data) {
            document.getElementById("resPlatformBadge").innerText = data.platform || "视频";
            document.getElementById("resAuthor").innerText = data.author || "创作者";
            document.getElementById("resAvatar").src = data.avatar || data.cover || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100";
            document.getElementById("resTitle").innerText = data.title || "";
            
            var qualityText = (data.medias && data.medias[0]) ? data.medias[0].quality : "最高画质";
            document.getElementById("resQualityText").innerText = qualityText;

            var container = document.getElementById("mediaContainer");
            container.innerHTML = "";

            if (data.type === "video") {
                var media = data.medias[0];
                var bgmHtml = "";
                if (data.music && data.music.download_url) {
                    bgmHtml = "<a href=\"" + data.music.download_url + "\" class=\"col-span-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-medium py-2.5 px-3 rounded-xl text-center text-xs border border-slate-700 transition flex items-center justify-center gap-1.5\">" +
                        "<span>🎵 下载背景原声 BGM (" + (data.music.title || "音频") + ")</span></a>";
                }

                container.innerHTML = "<div class=\"space-y-3\">" +
                    "<div class=\"relative rounded-2xl overflow-hidden bg-black shadow-inner border border-slate-700 aspect-video flex items-center justify-center\">" +
                    "<video src=\"" + media.raw_url + "\" controls playsinline poster=\"" + data.cover + "\" class=\"w-full h-full object-contain max-h-[360px]\"></video>" +
                    "</div>" +
                    "<div class=\"grid grid-cols-2 gap-2 pt-1\">" +
                    "<a href=\"" + media.download_url + "\" class=\"col-span-2 sm:col-span-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl text-center text-xs sm:text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20\">" +
                    "<span>⬇️ 下载最高画质视频</span></a>" +
                    "<a href=\"" + media.raw_url + "\" target=\"_blank\" class=\"col-span-2 sm:col-span-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-semibold py-3 px-4 rounded-xl text-center text-xs sm:text-sm border border-slate-700 transition flex items-center justify-center gap-2\">" +
                    "<span>🔗 打开原始直链</span></a>" +
                    bgmHtml +
                    "</div></div>";
            } else {
                // 图文 / 多图展示
                var count = data.count || data.medias.length;
                var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                
                var zipBtnHtml = "";
                if (data.zip_download_url) {
                    zipBtnHtml = "<a href=\"" + data.zip_download_url + "\" class=\"flex-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold py-2.5 px-3 rounded-xl shadow-md transition text-center flex items-center justify-center gap-1.5\">" +
                        "<span>📦 打包下载原图 (ZIP)</span></a>";
                }

                var batchBtnHtml = "<button type=\"button\" onclick=\"downloadAllSequential()\" id=\"batchDownloadBtn\" class=\"flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-semibold py-2.5 px-3 rounded-xl shadow-md transition text-center flex items-center justify-center gap-1.5 cursor-pointer\">" +
                    "<span>⬇️ 全部逐张下载 (" + count + "张)</span></button>";

                var bgmHtml = "";
                if (data.music && data.music.download_url) {
                    bgmHtml = "<a href=\"" + data.music.download_url + "\" class=\"w-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-medium py-2 px-3 rounded-xl text-center text-xs border border-slate-700 transition flex items-center justify-center gap-1.5\">" +
                        "<span>🎵 下载背景音乐 (" + (data.music.title || "BGM") + ")</span></a>";
                }

                var gridHtml = "<div class=\"space-y-3\">" +
                    "<div class=\"flex items-center justify-between text-xs text-slate-300 font-medium px-1\">" +
                    "<span>共发现 <b class=\"text-sky-400\">" + count + "</b> 张高清无损原图</span>" +
                    "<span class=\"text-[11px] text-slate-400\">点图放大长按可存相册</span>" +
                    "</div>" +
                    "<div class=\"flex flex-col sm:flex-row gap-2\">" + zipBtnHtml + batchBtnHtml + "</div>" +
                    bgmHtml +
                    "<div class=\"grid grid-cols-2 gap-3 pt-1\">";

                // 每个卡片使用固定的 9:16 壁纸黄金比例统一高度，整齐划一
                data.medias.forEach(function(m, i) {
                    gridHtml += "<div class=\"rounded-2xl overflow-hidden bg-slate-900 border border-slate-700/80 shadow-md flex flex-col justify-between\">" +
                        "<div class=\"w-full aspect-[9/16] bg-slate-950 flex items-center justify-center overflow-hidden cursor-zoom-in relative group\" onclick=\"openPreview('" + m.raw_url + "')\">" +
                        "<img src=\"" + m.raw_url + "\" loading=\"lazy\" class=\"w-full h-full object-contain group-hover:scale-105 transition duration-300\" />" +
                        "<span class=\"absolute top-2 left-2 bg-black/60 backdrop-blur-sm text-[10px] text-slate-300 px-2 py-0.5 rounded-md font-mono\">图 " + (i + 1) + "</span>" +
                        "</div>" +
                        "<div class=\"p-2 bg-slate-900 border-t border-slate-800/80 flex items-center justify-between gap-1\">" +
                        "<span class=\"text-[11px] font-semibold text-slate-400 pl-1\">原画无损</span>" +
                        "<a href=\"" + m.download_url + "\" class=\"bg-sky-600 hover:bg-sky-500 text-white text-[11px] font-medium px-3 py-1 rounded-lg transition shadow-sm flex items-center gap-1\">" +
                        "<span>下载</span></a>" +
                        "</div></div>";
                });
                gridHtml += "</div></div>";
                container.innerHTML = gridHtml;
            }

            var card = document.getElementById("resultCard");
            card.classList.remove("hidden");
            card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
    </script>
</body>
</html>
